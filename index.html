<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DungeonKing — Dungeon-Grade BDSM Gear</title>
<meta name="description" content="Professional BDSM gear from DungeonKing. Free US shipping over $119, always discreet packages, 101-day returns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23c1272d'/%3E%3Ctext x='50' y='68' font-size='50' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EDK%3C/text%3E%3C/svg%3E">
</head>
<body>
<header id="site-header"></header>

<main>
  <section class="hero wrap" id="hero">
    <div class="hero-content">
      <span class="logo-mark">DK</span>
      <h1>Rule Your Dungeon</h1>
      <span class="sub">DUNGEON-GRADE GEAR FROM <b>DUNGEONKING</b></span>
      <div><a class="btn" href="category.html?c=best-sellers">SHOP NOW</a></div>
    </div>
  </section>

  <div class="wrap">
    <div class="section-head">
      <h2>BDSM Gear by DungeonKing</h2>
      <p>Professional equipment, tested in-house, shipped discreetly</p>
    </div>
    <div class="trust-row">
      <span><i>🚚</i> Over $119</span>
      <span><i>📦</i> Discreet</span>
      <span><i>🤝</i> Support</span>
      <span><i>↩️</i> Free Returns</span>
    </div>
    <div class="cat-grid" id="cat-grid"></div>

  </div>

  <section class="story" id="story" aria-label="What DungeonKing does">
    <div class="story-sticky">
      <div class="story-dots" id="story-dots"></div>
      <div id="story-steps"></div>
      <div class="story-scroll-hint">Scroll</div>
    </div>
  </section>

  <div class="wrap">
    <div class="quote-strip" id="quote-strip"></div>

    <div class="section-head"><h2>Browse Featured Products</h2></div>
    <div class="grid" id="featured-grid"></div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/hero-fx.js"></script>
<script src="assets/js/motion.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const cats = NAV.filter((c) => c.blurb).slice(0, 6);
  $("#cat-grid").innerHTML = cats.map((c) => {
    const sample = PRODUCTS.find((p) => p.category === c.slug && p.featured) || PRODUCTS.find((p) => p.category === c.slug);
    return `<a class="cat-card" href="category.html?c=${c.slug}">
      <img src="${imgFor(sample, 1)}" alt="${c.name}">
      <div class="cc-body">
        <h3>${c.name}</h3>
        <p class="cc-sub">${c.blurb}</p>
        <span class="cc-link">Browse ${c.name} ›</span>
      </div>
    </a>`;
  }).join("");

  $("#quote-strip").innerHTML = `
    <h2 style="margin-bottom:10px">Gear that Commands Respect</h2>
    <p style="color:var(--muted);margin-bottom:18px">If you are looking for proven BDSM gear built to last, you have arrived at the right place.</p>
    ${stars(QUOTE_STRIP.stars)} <em>${QUOTE_STRIP.text}</em> <small>-${QUOTE_STRIP.author}</small>`;

  $("#featured-grid").innerHTML = PRODUCTS.filter((p) => p.featured).map((p) => productCard(p)).join("");

  /* ---------- cinematic scroll story ---------- */
  const CHAPTERS = [
    { kicker: "Chapter 01 — The Gear", title: "Built to Hold", num: "01",
      text: "Restraints, impact, sensory, electro. Every piece tested in-house, shipped in a plain box, backed for 101 days.",
      cta: ["Shop Best Sellers", "category.html?c=best-sellers"] },
    { kicker: "Chapter 02 — The Sessions", title: "Rent the Room", num: "02",
      text: "Three private, fully equipped dungeons — yours by the hour. Professionally cleaned, absolutely discreet.",
      cta: ["Book a Session", "dungeon.html"] },
    { kicker: "Chapter 03 — The Builds", title: "Own the Dungeon", num: "03",
      text: "Our crew designs and builds dungeons anywhere — from a convertible spare room to a full commercial playspace.",
      cta: ["Request a Build", "dungeon.html#build"] },
  ];
  $("#story-steps").innerHTML = CHAPTERS.map((c) => `
    <div class="story-step">
      <p class="story-kicker">${c.kicker}</p>
      <h2>${c.title}</h2>
      <p>${c.text}</p>
      <a class="btn btn-red" href="${c.cta[1]}">${c.cta[0]}</a>
      <span class="story-num">${c.num}</span>
    </div>`).join("");
  $("#story-dots").innerHTML = CHAPTERS.map(() => "<i></i>").join("");

  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const story = $("#story"), hero = $("#hero");
    const steps = $$(".story-step"), dots = $$("#story-dots i");
    let ticking = false;
    function paint() {
      ticking = false;
      const vh = innerHeight;
      /* hero shrinks and dims as it leaves the viewport */
      const hp = Math.min(1, Math.max(0, scrollY / (vh * 0.9)));
      hero.style.transform = `scale(${1 - hp * 0.07})`;
      hero.style.opacity = 1 - hp * 0.35;
      /* story progress 0..1 across the pinned distance */
      const r = story.getBoundingClientRect();
      const total = r.height - vh;
      const p = Math.min(1, Math.max(0, -r.top / total));
      const active = Math.min(CHAPTERS.length - 1, Math.floor(p * CHAPTERS.length));
      steps.forEach((s, i) => {
        const center = (i + 0.5) / CHAPTERS.length;
        const d = (p - center) * CHAPTERS.length;      // 0 when chapter centered
        const vis = Math.max(0, 1 - Math.abs(d) * 1.55);
        s.style.opacity = vis;
        s.style.transform = `translateY(${d * -70}px) scale(${1 - Math.abs(d) * 0.06})`;
        s.classList.toggle("active", i === active);
      });
      dots.forEach((el, i) => el.classList.toggle("on", i === active));
    }
    addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(paint); } }, { passive: true });
    addEventListener("resize", paint);
    paint();
  }
});
</script>
</body>
</html>
