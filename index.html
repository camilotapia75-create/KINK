<body>
<header id="site-header"></header>

<main>
  <section class="hero wrap" id="hero">
    <div class="hero-content">
      <span class="logo-mark">DK</span>
      <h1>Rule Your Dungeon</h1>
      <span class="sub">DUNGEON-GRADE GEAR FROM <b>DUNGEONKING</b></span>

      <span><i>🚚</i> Over $119</span>
      <span><i>📦</i> Discreet</span>

</main>

<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/hero-fx.js"></script>
<script src="assets/js/motion.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const cats = NAV.filter((c) => c.blurb).slice(0, 6);
  $("#cat-grid").innerHTML = cats.map((c) => {
    const sample = PRODUCTS.find((p) => p.category === c.slug && p.featured) || PRODUCTS.find((p) => p.category === c.slug);
    return `<a class="cat-card" href="category.html?c=${c.slug}">
      <img src="${imgFor(sample, 1)}" alt="${c.name}">
      <div class="cc-body">
        <h3>${c.name}</h3>
        <p class="cc-sub">${c.blurb}</p>
        <span class="cc-link">Browse ${c.name} ›</span>
      </div>
    </a>`;
  }).join("");

  $("#quote-strip").innerHTML = `
    <h2 style="margin-bottom:10px">Gear that Commands Respect</h2>
    <p style="color:var(--muted);margin-bottom:18px">If you are looking for proven BDSM gear built to last, you have arrived at the right place.</p>
    ${stars(QUOTE_STRIP.stars)} <em>${QUOTE_STRIP.text}</em> <small>-${QUOTE_STRIP.author}</small>`;

  $("#featured-grid").innerHTML = PRODUCTS.filter((p) => p.featured).map((p) => productCard(p)).join("");
});
</script>
